name: Entire graph
# Generates entire-graph output for the current commit without an agent session
# or a developer machine (Jevelopers-neatHack-2026/getticketstub.com#27). Run manually from the Actions tab.
on:
  # PR runs only check that the graph is generated; pushing a branch is manual-only.
  pull_request:
    paths: [.github/workflows/entire-graph.yml]
  workflow_dispatch:
    inputs:
      push_branch:
        description: Push init-agents output to an entire-graph/<sha> branch for review
        type: boolean
        default: true
permissions:
  contents: read
env:
  ENTIRE_VERSION: v0.11.4
  ENTIRE_NO_AUTO_UPDATE: '1'
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Entire CLI
        run: |
          mkdir -p "$RUNNER_TEMP/entire" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/entire"
          base="https://github.com/entireio/cli/releases/download/$ENTIRE_VERSION"
          curl -fsSLO "$base/entire_linux_amd64.tar.gz"
          curl -fsSLO "$base/checksums.txt"
          grep ' entire_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf entire_linux_amd64.tar.gz
          install -m 0755 entire git-remote-entire "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install graph plugin
        run: |
          entire version
          entire plugin install graph
          entire graph version --json | tee "$RUNNER_TEMP/graph-version.json"
          entire graph capabilities --json > "$RUNNER_TEMP/graph-capabilities.json"
      - name: Export graph snapshot
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          entire graph snapshot --repo . --format compact-ndjson > "$out/graph-snapshot.ndjson"
          cp "$RUNNER_TEMP/graph-version.json" "$RUNNER_TEMP/graph-capabilities.json" "$out/"
          git rev-parse HEAD > "$out/commit.txt"
          (cd "$out" && sha256sum graph-snapshot.ndjson graph-version.json graph-capabilities.json commit.txt > SHA256SUMS)
          {
            echo "### entire-graph for \`$(git rev-parse HEAD)\`"
            echo "- Entire CLI: \`$ENTIRE_VERSION\`; graph plugin: \`$(tr -d '\n' < "$RUNNER_TEMP/graph-version.json")\`"
            echo "- Snapshot records: $(wc -l < "$out/graph-snapshot.ndjson")"
            echo "- Snapshot SHA-256: \`$(sha256sum "$out/graph-snapshot.ndjson" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: entire-graph-${{ github.sha }}
          path: ${{ runner.temp }}/out
          retention-days: 90
      - name: Write agent instructions
        run: entire graph init-agents --repo .
      - name: Push init-agents output for review
        if: github.event_name == 'workflow_dispatch' && inputs.push_branch
        run: |
          branch="entire-graph/${GITHUB_SHA::7}"
          git add .entire/graph-agent.md AGENTS.md CLAUDE.md
          if git diff --cached --quiet; then
            echo "No init-agents changes to push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Enable entire-graph (generated from ${GITHUB_SHA::7})"
          git push origin "HEAD:refs/heads/$branch"
          echo "- Pushed \`$branch\` for review" >> "$GITHUB_STEP_SUMMARY"
