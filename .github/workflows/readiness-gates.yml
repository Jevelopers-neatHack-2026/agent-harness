name: Readiness gates

on:
  pull_request:
    paths:
      - '.github/workflows/readiness-gates.yml'
      - 'tools/verify_contract_release.py'
      - 'tools/validate_jev_targets.py'
      - 'tests/readiness/**'
      - 'fixtures/contracts/**'
      - 'evals/jev/**'
      - 'docs/decisions/contract-readiness.md'
      - 'docs/decisions/evaluation-plan.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/readiness-gates.yml'
      - 'tools/verify_contract_release.py'
      - 'tools/validate_jev_targets.py'
      - 'tests/readiness/**'
      - 'fixtures/contracts/**'
      - 'evals/jev/**'
      - 'docs/decisions/contract-readiness.md'
      - 'docs/decisions/evaluation-plan.md'

permissions:
  contents: read

jobs:
  checker-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bubblewrap and the Ubuntu confined user namespace profile
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes apparmor apparmor-profiles bubblewrap
      - name: Load and verify Ubuntu's restricted bubblewrap profile
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          command -v bwrap
          bwrap --version
          bwrap_path=$(readlink -f "$(command -v bwrap)")
          if [[ "$bwrap_path" != "/usr/bin/bwrap" ]]; then
            echo "::error::The packaged AppArmor policy only covers /usr/bin/bwrap; refusing a different executable path."
            exit 1
          fi
          command -v apparmor_parser
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [[ ! -r "$profile" ]] || ! dpkg-query -S "$profile" | grep -q '^apparmor-profiles:'; then
            echo "::error::The Ubuntu apparmor-profiles package did not provide its bwrap-userns-restrict policy."
            exit 1
          fi
          for local_override in /etc/apparmor.d/local/bwrap-userns-restrict /etc/apparmor.d/local/unpriv_bwrap; do
            if [[ -e "$local_override" || -L "$local_override" ]]; then
              echo "::error::Refusing an unreviewed local override of the Ubuntu bubblewrap confinement policy."
              exit 1
            fi
          done
          if [[ ! -r /sys/kernel/security/apparmor/profiles ]]; then
            echo "::error::The runner does not expose the AppArmor profile status interface."
            exit 1
          fi
          sudo apparmor_parser -r "$profile"
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = {"bwrap", "unpriv_bwrap"}
          loaded = {}
          for line in Path("/sys/kernel/security/apparmor/profiles").read_text(encoding="utf-8").splitlines():
              try:
                  name, mode = line.rsplit(" ", 1)
              except ValueError:
                  continue
              if name in required:
                  loaded[name] = mode.strip("()")
          if loaded != {name: "enforce" for name in required}:
              raise SystemExit("Required Ubuntu bubblewrap profiles are not both loaded in enforce mode.")
          print(json.dumps({"status": "ubuntu_bwrap_restricted_profile_loaded",
                            "profiles": dict(sorted(loaded.items()))}, sort_keys=True,
                           separators=(",", ":")))
          PY
      - name: Run standalone readiness checker tests without skips
        env:
          ACV1_REQUIRE_BWRAP: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/readiness -v 2>&1 | tee "$RUNNER_TEMP/readiness-tests.log"
          if grep -Eq 'skipped=[1-9]' "$RUNNER_TEMP/readiness-tests.log"; then
            echo "::error::Required readiness coverage must not be skipped on the Linux CI runner."
            exit 1
          fi
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: readiness-checker-tests
          path: ${{ runner.temp }}/readiness-tests.log
          if-no-files-found: error
          retention-days: 7

  contract-readiness-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report runner Python version
        run: python3 --version
      - name: Confirm canonical release remains blocked on its exact owner actions
        run: |
          python3 tests/readiness/classify_ci_gates.py --gate contracts --output "$RUNNER_TEMP/contract-readiness-blocked.json"
          cat "$RUNNER_TEMP/contract-readiness-blocked.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish classified canonical release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: canonical-release-readiness-classification
          path: ${{ runner.temp }}/contract-readiness-blocked.json
          if-no-files-found: error
          retention-days: 30

  jev-readiness-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report runner Python version
        run: python3 --version
      - name: Confirm JEV targets remain blocked on owner definitions and evidence
        run: |
          python3 tests/readiness/classify_ci_gates.py --gate jev --output "$RUNNER_TEMP/jev-readiness-blocked.json"
          cat "$RUNNER_TEMP/jev-readiness-blocked.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish classified JEV readiness evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jev-readiness-classification
          path: ${{ runner.temp }}/jev-readiness-blocked.json
          if-no-files-found: error
          retention-days: 30

  sandbox-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bubblewrap and the Ubuntu confined user namespace profile
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes apparmor apparmor-profiles bubblewrap
      - name: Load and verify Ubuntu's restricted bubblewrap profile
        shell: bash
        run: |
          set -euo pipefail
          command -v bwrap
          bwrap --version
          bwrap_path=$(readlink -f "$(command -v bwrap)")
          if [[ "$bwrap_path" != "/usr/bin/bwrap" ]]; then
            echo "::error::The packaged AppArmor policy only covers /usr/bin/bwrap; refusing a different executable path."
            exit 1
          fi
          command -v apparmor_parser
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [[ ! -r "$profile" ]] || ! dpkg-query -S "$profile" | grep -q '^apparmor-profiles:'; then
            echo "::error::The Ubuntu apparmor-profiles package did not provide its bwrap-userns-restrict policy."
            exit 1
          fi
          for local_override in /etc/apparmor.d/local/bwrap-userns-restrict /etc/apparmor.d/local/unpriv_bwrap; do
            if [[ -e "$local_override" || -L "$local_override" ]]; then
              echo "::error::Refusing an unreviewed local override of the Ubuntu bubblewrap confinement policy."
              exit 1
            fi
          done
          if [[ ! -r /sys/kernel/security/apparmor/profiles ]]; then
            echo "::error::The runner does not expose the AppArmor profile status interface."
            exit 1
          fi
          sudo apparmor_parser -r "$profile"
          python3 - <<'PY'
          import json
          from pathlib import Path
          required = {"bwrap", "unpriv_bwrap"}
          loaded = {}
          for line in Path("/sys/kernel/security/apparmor/profiles").read_text(encoding="utf-8").splitlines():
              try:
                  name, mode = line.rsplit(" ", 1)
              except ValueError:
                  continue
              if name in required:
                  loaded[name] = mode.strip("()")
          if loaded != {name: "enforce" for name in required}:
              raise SystemExit("Required Ubuntu bubblewrap profiles are not both loaded in enforce mode.")
          print(json.dumps({"status": "ubuntu_bwrap_restricted_profile_loaded",
                            "profiles": dict(sorted(loaded.items()))}, sort_keys=True,
                           separators=(",", ":")))
          PY
      - name: Require Linux bubblewrap filesystem, network, and descendant canaries
        run: python3 tests/readiness/classify_ci_gates.py --gate sandbox --output "$RUNNER_TEMP/sandbox-canaries.json"
      - name: Publish real synthetic sandbox canary evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bubblewrap-sandbox-canaries
          path: ${{ runner.temp }}/sandbox-canaries.json
          if-no-files-found: error
          retention-days: 30
