name: Readiness gates

on:
  pull_request:
    paths:
      - '.github/workflows/readiness-gates.yml'
      - 'tools/verify_contract_release.py'
      - 'tools/validate_jev_targets.py'
      - 'tests/readiness/**'
      - 'fixtures/contracts/**'
      - 'evals/jev/**'
      - 'docs/decisions/contract-readiness.md'
      - 'docs/decisions/evaluation-plan.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/readiness-gates.yml'
      - 'tools/verify_contract_release.py'
      - 'tools/validate_jev_targets.py'
      - 'tests/readiness/**'
      - 'fixtures/contracts/**'
      - 'evals/jev/**'

permissions:
  contents: read

jobs:
  checker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report runner Python version
        run: python3 --version
      - name: Run standalone readiness checker tests
        run: python3 -m unittest discover -s tests/readiness -v

  contract-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report runner Python version
        run: python3 --version
      - name: Verify owner-published canonical release and fixtures
        run: python3 tools/verify_contract_release.py --manifest fixtures/contracts/release.json --offline

  jev-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Report runner Python version
        run: python3 --version
      - name: Validate owner-approved JEV targets and dataset
        run: python3 tools/validate_jev_targets.py --targets evals/jev/promotion-targets.json --dataset evals/jev/dataset-manifest.json
